<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Appa Speaks</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1923">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

:root {
  --bg: #0f1923;
  --surface: #1a2535;
  --surface2: #243044;
  --accent: #2DD4BF;
  --accent2: #F59E0B;
  --danger: #EF4444;
  --success: #22C55E;
  --purple: #A78BFA;
  --text: #F1F5F9;
  --text-dim: #94A3B8;
  --border: rgba(255,255,255,0.08);
  --radius: 20px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  display: flex;
  flex-direction: column;
}

/* ── APP SHELL (centers + frames the app on big screens) ── */
.app {
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
@media (min-width: 1080px) {
  body { padding: 20px; }
  .app {
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55);
  }
}

/* ── TOP BAR ── */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 10px;
}
.topbar-title { font-size:1.05rem; font-weight:900; color:var(--accent); letter-spacing:-0.3px; white-space:nowrap; }
.topbar-right { display:flex; gap:10px; align-items:center; }

.lang-toggle {
  display:flex; border-radius:12px; overflow:hidden;
  border: 1px solid var(--border);
}
.lang-btn {
  padding: 10px 16px; font-size:0.9rem; font-weight:800;
  background:transparent; border:none; color:var(--text-dim); cursor:pointer;
  font-family:'Nunito',sans-serif; transition: all 0.2s;
}
.lang-btn.active { background:var(--accent); color:#000; }

.listen-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 16px;
  color: var(--text); font-family:'Nunito',sans-serif;
  font-size: 0.9rem; font-weight:800; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition: all 0.2s; white-space:nowrap;
}
.listen-btn.listening { background:var(--danger); border-color:var(--danger); animation: pulse-btn 1s ease-in-out infinite; }
@keyframes pulse-btn { 0%,100%{opacity:1} 50%{opacity:0.75} }

/* ── LAST SPOKEN BAR ── */
.last-bar {
  background: rgba(45,212,191,0.08);
  border-bottom: 1px solid rgba(45,212,191,0.15);
  padding: 8px 14px;
  display:flex; align-items:center; gap:10px;
  flex-shrink:0; min-height:42px;
}
.last-text {
  font-size:0.95rem; font-weight:800; color:var(--accent);
  flex:1; line-height:1.3;
}
.last-empty { color:var(--text-dim); font-size:0.82rem; font-weight:600; }
.again-btn {
  background: rgba(45,212,191,0.15); border: 1px solid rgba(45,212,191,0.3);
  color: var(--accent); border-radius:8px; padding:5px 12px;
  font-size:0.75rem; font-weight:800; cursor:pointer;
  font-family:'Nunito',sans-serif; flex-shrink:0;
  display:none;
}

/* ── TABS ── */
.tabs {
  display:flex; background:var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink:0; overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  padding: 13px 18px; font-size:0.9rem; font-weight:800;
  color:var(--text-dim); cursor:pointer; white-space:nowrap;
  border-bottom: 3px solid transparent; transition: all 0.2s;
  background:transparent; border-top:none; border-left:none; border-right:none;
  font-family:'Nunito',sans-serif; flex-shrink:0;
}
.tab.active { color:var(--text); border-bottom-color:var(--accent); }

/* ── BUTTON GRID ── */
.grid-wrap { flex:1; overflow:hidden; position:relative; }
.btn-grid {
  position:absolute; inset:0;
  overflow-y:auto; padding:12px;
  display:grid; gap:10px;
  grid-template-columns: repeat(2, 1fr);
  align-content: start;
  scrollbar-width:thin;
  scrollbar-color: var(--surface2) transparent;
}
/* iPad/phone stay at 2 big columns; computers get a tidy 3 */
@media (min-width: 880px) {
  .btn-grid { grid-template-columns: repeat(3, 1fr); }
}
.btn-grid.hidden { display:none; }

.comm-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 22px 12px;
  cursor:pointer;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:9px; min-height:128px;
  transition: transform 0.1s, border-color 0.15s, background 0.15s;
  position:relative; overflow:hidden;
  -webkit-tap-highlight-color: transparent;
}
.comm-btn:active { transform:scale(0.93); }

.comm-btn .icon { font-size:2.7rem; line-height:1; }
.comm-btn .len { font-size:1.12rem; font-weight:800; color:var(--text); text-align:center; line-height:1.2; }
.comm-btn .lta { font-size:0.88rem; font-weight:600; color:var(--text-dim); text-align:center; line-height:1.3; margin-top:1px; }

.comm-btn.needs { border-color:rgba(45,212,191,0.2); }
.comm-btn.needs:active { border-color:var(--accent); background:rgba(45,212,191,0.08); }
.comm-btn.medical { border-color:rgba(239,68,68,0.2); }
.comm-btn.medical:active { border-color:var(--danger); background:rgba(239,68,68,0.08); }
.comm-btn.emotion { border-color:rgba(245,158,11,0.2); }
.comm-btn.emotion:active { border-color:var(--accent2); background:rgba(245,158,11,0.08); }
.comm-btn.family { border-color:rgba(167,139,250,0.2); }
.comm-btn.family:active { border-color:var(--purple); background:rgba(167,139,250,0.08); }

.comm-btn.urgent {
  border-color: var(--danger) !important;
  background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(239,68,68,0.12));
  grid-column: 1 / -1;
  padding: 16px;
  min-height: 124px;
  box-shadow: 0 0 0 2px rgba(239,68,68,0.4), 0 4px 20px rgba(239,68,68,0.3);
  animation: urgent-pulse 2s ease-in-out infinite;
}
@keyframes urgent-pulse {
  0%,100%{ box-shadow: 0 0 0 2px rgba(239,68,68,0.4), 0 4px 20px rgba(239,68,68,0.2); }
  50%{ box-shadow: 0 0 0 4px rgba(239,68,68,0.6), 0 4px 30px rgba(239,68,68,0.4); }
}
.comm-btn.urgent .len { color: #fff; font-size:1.2rem; letter-spacing:1px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.comm-btn.urgent .lta { color: rgba(255,255,255,0.8); font-size:0.85rem; }
.comm-btn.urgent .icon { font-size:2rem; }

/* pain scale */
.pain-row {
  grid-column: 1 / -1;
  background: var(--surface);
  border: 2px solid rgba(245,158,11,0.2);
  border-radius:16px; padding:12px;
  display:flex; flex-direction:column; gap:8px;
}
.pain-label { font-size:0.8rem; font-weight:800; color:var(--text-dim); text-align:center; }
.pain-scale { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.pain-num {
  width:44px; height:44px; border-radius:10px;
  border:none; cursor:pointer; font-family:'Nunito',sans-serif;
  font-size:1rem; font-weight:800; transition:transform 0.1s;
}
.pain-num:active { transform:scale(0.88); }

/* ── LISTEN OVERLAY ── */
.listen-overlay {
  position:fixed; inset:0; z-index:100;
  background: rgba(0,0,0,0.88);
  backdrop-filter:blur(12px);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:30px; gap:18px;
  opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.listen-overlay.active { opacity:1; pointer-events:all; }
.listen-orb {
  width:90px; height:90px; border-radius:50%;
  background: radial-gradient(circle, rgba(239,68,68,0.35) 0%, transparent 70%);
  display:flex; align-items:center; justify-content:center; font-size:2.8rem;
  animation: orb-pulse 1.2s ease-in-out infinite;
}
@keyframes orb-pulse {
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.3),0 0 0 15px rgba(239,68,68,0.08)}
  50%{box-shadow:0 0 0 15px rgba(239,68,68,0.2),0 0 0 30px rgba(239,68,68,0.04)}
}
.listen-title { font-size:1.2rem; font-weight:900; color:var(--text); }
.listen-hint { font-size:0.85rem; color:var(--text-dim); text-align:center; max-width:280px; line-height:1.5; }
.transcript-box {
  background: var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:14px 16px; width:100%; max-width:360px;
  min-height:56px; font-size:1rem; font-weight:700;
  color:var(--accent); text-align:center; line-height:1.5;
}
.listen-stop {
  background:var(--surface2); border:1px solid var(--border);
  color:var(--text); font-family:'Nunito',sans-serif;
  font-size:0.9rem; font-weight:800; padding:12px 32px;
  border-radius:50px; cursor:pointer;
}

/* ── SUGGESTIONS PANEL ── */
.sugg-panel {
  position:fixed; bottom:0; left:50%; right:auto; z-index:90;
  width:100%; max-width:1040px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius:20px 20px 0 0;
  padding:14px 14px 28px;
  transform:translateX(-50%) translateY(100%); transition:transform 0.38s cubic-bezier(0.34,1.4,0.64,1);
  max-height:75vh; overflow-y:auto;
}
.sugg-panel.active { transform:translateX(-50%) translateY(0); }
.sugg-head {
  display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px;
}
.sugg-meta { flex:1; }
.sugg-label { font-size:0.72rem; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
.sugg-heard { font-size:0.85rem; color:var(--accent); font-weight:700; margin-top:2px; }
.sugg-close { background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:4px 10px; font-size:1rem; cursor:pointer; flex-shrink:0; }
.sugg-grid { display:flex; flex-direction:column; gap:7px; }
.sugg-btn {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:12px; padding:12px 14px;
  cursor:pointer; text-align:left;
  transition: all 0.15s; font-family:'Nunito',sans-serif;
  display:flex; flex-direction:column; gap:3px;
}
.sugg-btn:active { transform:scale(0.97); border-color:var(--accent); background:rgba(45,212,191,0.07); }
.s-en { font-size:0.95rem; font-weight:800; color:var(--text); }
.s-ta { font-size:0.78rem; color:var(--text-dim); font-weight:600; }

/* ── CUSTOM TYPE ── */
.custom-panel {
  position:fixed; bottom:0; left:50%; right:auto; z-index:95;
  width:100%; max-width:1040px;
  background:var(--surface); border-top:1px solid var(--border);
  border-radius:20px 20px 0 0; padding:16px;
  transform:translateX(-50%) translateY(100%); transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
}
.custom-panel.active { transform:translateX(-50%) translateY(0); }
.custom-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.custom-title { font-size:0.9rem; font-weight:900; color:var(--text-dim); }
.custom-close { background:transparent; border:none; color:var(--text-dim); font-size:1.1rem; cursor:pointer; padding:4px 8px; }
.custom-input {
  width:100%; background:var(--bg); border:1.5px solid var(--border);
  border-radius:14px; padding:16px; color:var(--text);
  font-family:'Nunito',sans-serif; font-size:1.15rem; font-weight:700;
  margin-bottom:12px; outline:none;
}
.custom-input:focus { border-color:var(--accent); }
.custom-actions { display:flex; gap:10px; }
.custom-go {
  flex:1; width:100%; background:var(--accent); border:none; color:#000;
  font-family:'Nunito',sans-serif; font-size:1.15rem; font-weight:900;
  padding:20px 14px; min-height:66px; border-radius:14px; cursor:pointer;
}
.custom-go.wa { background:#25D366; color:#fff; }
.custom-clear {
  width:100%; margin-top:10px; background:transparent; border:1px solid var(--border);
  color:var(--text-dim); font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:800;
  padding:12px; min-height:48px; border-radius:12px; cursor:pointer;
}
#type-fab {
  position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:90;
  background:var(--accent); color:#000; border:none; border-radius:999px;
  font-family:'Nunito',sans-serif; font-size:1.1rem; font-weight:900;
  padding:16px 28px; min-height:60px; box-shadow:0 8px 24px rgba(0,0,0,0.4); cursor:pointer;
}

/* ── CANVAS PANEL ── */
#canvas-panel {
  position:fixed; top:0; bottom:0; left:50%; right:auto; z-index:96;
  width:100%; max-width:1040px;
  background:var(--bg);
  display:flex; flex-direction:column;
  transform:translateX(-50%) translateY(100%); transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
}
#canvas-panel.active { transform:translateX(-50%) translateY(0); }
.canvas-head {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.canvas-title { font-size:1rem; font-weight:900; color:var(--text); }
.canvas-sub { font-size:0.7rem; color:var(--text-dim); margin-top:2px; }
#write-canvas {
  flex:1; width:100%; cursor:crosshair;
  background:#fff; display:block;
  touch-action:none;
}
.canvas-tools {
  display:flex; gap:8px; padding:10px 14px;
  border-top:1px solid var(--border);
  flex-shrink:0; align-items:center;
  flex-wrap:wrap;
}
.canvas-btn {
  padding:10px 16px; border-radius:12px; border:none;
  font-family:'Nunito',sans-serif; font-size:0.82rem; font-weight:800;
  cursor:pointer; flex:1; min-width:70px;
}
.canvas-btn.clear { background:var(--surface2); color:var(--text-dim); }
.canvas-btn.save  { background:#22c55e; color:#fff; }
.canvas-btn.speak { background:var(--accent); color:#000; }
.canvas-btn.close { background:transparent; border:1px solid var(--border); color:var(--text-dim); }
.canvas-size {
  display:flex; gap:4px; align-items:center;
}
.size-dot {
  border-radius:50%; background:var(--text); cursor:pointer;
  border:2px solid transparent; transition:border-color 0.15s;
}
.size-dot.active { border-color:var(--accent); }

/* Saved writings log */
#writings-log {
  max-height:120px; overflow-y:auto;
  padding:0 14px 8px; display:flex; flex-direction:column; gap:6px;
  flex-shrink:0;
}
.writing-entry {
  display:flex; align-items:center; gap:8px;
  background:var(--surface2); border-radius:10px; padding:6px 10px;
  font-size:0.75rem; color:var(--text-dim);
}
.writing-thumb {
  width:48px; height:28px; border-radius:6px;
  border:1px solid var(--border); flex-shrink:0;
  object-fit:contain; background:#fff;
}
.writing-time { flex:1; }
.writing-del { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:0.85rem; padding:2px 4px; }

/* ── WALK LINK ── */
.walk-link {
  position:fixed; bottom:16px; right:16px; z-index:50;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:50px; padding:8px 16px;
  font-size:0.75rem; font-weight:800; color:var(--text-dim);
  text-decoration:none; display:flex; align-items:center; gap:6px;
}
</style>
</head>
<body>

<div class="app">

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">🗣 Appa Speaks</div>
  <div class="topbar-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-ta" onclick="setLang('ta')">தமிழ்</button>
    </div>
    <button class="listen-btn" id="listen-btn" onclick="toggleListen()">
      <span id="listen-icon">🎙</span>
      <span id="listen-lbl">Listen</span>
    </button>
    <button class="listen-btn" onclick="openVoicePicker()" style="padding:7px 10px;">🔊▾</button>
  </div>
</div>

<!-- VOICE PICKER OVERLAY -->
<div class="listen-overlay" id="voice-picker" style="z-index:200;display:none;opacity:1;pointer-events:all;">
  <div style="font-size:2.5rem">🎙</div>
  <div class="listen-title">Choose Voice</div>
  <div class="listen-hint">Select a male voice — look for Daniel, Rishi, or similar</div>
  <select id="voice-select" style="width:100%;max-width:340px;padding:12px 14px;border-radius:12px;background:#1a2535;color:#F1F5F9;border:1px solid rgba(255,255,255,0.15);font-size:0.95rem;font-family:Nunito,sans-serif;margin:4px 0;"></select>
  <button class="listen-btn" style="padding:10px 24px;font-size:0.9rem;" onclick="testVoice()">▶ Test This Voice</button>
  <button class="listen-stop" onclick="saveVoice()">✓ Use This Voice</button>
  <button class="listen-stop" style="background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);margin-top:4px;" onclick="closeVoicePicker()">Cancel</button>
</div>

<!-- LAST SPOKEN -->
<div class="last-bar">
  <div class="last-text" id="last-text"><span class="last-empty">Tap any button to speak →</span></div>
  <button class="again-btn" id="again-btn" onclick="speakAgain()">🔊 Again</button>
  <button class="again-btn" id="share-btn" onclick="shareLast()" style="display:none;background:rgba(37,211,102,0.15);border-color:rgba(37,211,102,0.4);color:#25D366;">📲 Share</button>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="setTab('needs',this)">🙏 Needs</button>
  <button class="tab" onclick="setTab('medical',this)">🏥 Medical</button>
  <button class="tab" onclick="setTab('emotion',this)">💛 Feelings</button>
  <button class="tab" onclick="setTab('family',this)">👨‍👩‍👧 Family</button>
  <button class="tab" onclick="setTab('custom',this)">✍️ Write</button>
</div>

<!-- GRIDS -->
<div class="grid-wrap">

  <!-- NEEDS -->
  <div class="btn-grid" id="grid-needs">
    <button class="comm-btn needs urgent" onclick="tap('Help me!','உதவி செய்யுங்கள்!')">
      <span class="icon">🚨</span><span class="len">HELP ME</span><span class="lta">உதவி செய்யுங்கள்</span>
    </button>
    <button class="comm-btn needs" onclick="tap('There is secretion in my mouth','என் வாயில் எச்சில் தேங்கியிருக்கிறது')">
      <span class="icon">💧</span><span class="len">Mouth Secretion</span><span class="lta">வாயில் எச்சில்</span>
    </button>
    <button class="comm-btn needs" onclick="tap('I need to urinate','எனக்கு சிறுநீர் கழிக்க வேண்டும்')">
      <span class="icon">🚽</span><span class="len">Need to Pee</span><span class="lta">சிறுநீர் கழிக்கணும்</span>
    </button>
    <button class="comm-btn needs" onclick="tap('I need to pass motion','எனக்கு மலம் கழிக்க வேண்டும்')">
      <span class="icon">🚻</span><span class="len">Need to Poop</span><span class="lta">மலம் கழிக்கணும்</span>
    </button>
    <button class="comm-btn needs" onclick="tap('I am in pain','எனக்கு வலி இருக்கிறது')">
      <span class="icon">😣</span><span class="len">Pain</span><span class="lta">வலி</span>
    </button>
    <button class="comm-btn needs" onclick="tap('Can you do suction','சக்ஷன் செய்ய முடியுமா?')">
      <span class="icon">🌬️</span><span class="len">Suction</span><span class="lta">சக்ஷன்</span>
    </button>
    <button class="comm-btn needs" onclick="tap('Please sit me up a little','என்னை சற்று உட்கார வையுங்கள்')">
      <span class="icon">🪑</span><span class="len">Sit Me Up</span><span class="lta">உட்கார வையுங்க</span>
    </button>
    <button class="comm-btn needs" onclick="tap('I feel warm','எனக்கு வெப்பமாக இருக்கிறது')">

<script>
// ─── STATE ───────────────────────────────────────────────
let lang = 'en';
let lastEn = '', lastTa = '';
let recognition = null;
let listening = false;

// ─── CLONED VOICE (Appa's real voice) ────────────────────
// Pre-rendered button phrases are looked up in this manifest; anything
// else (typed/handwritten text) is synthesised live via /api/tts.
const SEP = String.fromCharCode(1);  // unique key separator
let voiceMap = {};                 // key: lang + SEP + text -> filename -> "en_0001.mp3"
const cloneAudio = new Audio();
cloneAudio.preload = 'auto';
fetch('/voice/manifest.json')
  .then(r => r.ok ? r.json() : [])
  .then(list => list.forEach(e => { voiceMap[e.lang + SEP + e.text] = e.file; }))
  .catch(() => {});

// Cache live-generated cloned-voice audio by text, so replaying (🔊 Again) or
// sharing the SAME message reuses it instead of re-calling (and re-charging) the API.
const ttsCache = new Map();  // lang2 + SEP + text -> Blob
async function ttsBlob(text, lang2) {
  const key = lang2 + SEP + text;
  if (ttsCache.has(key)) return ttsCache.get(key);
  const r = await fetch('/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, lang: lang2 })
  });
  if (!r.ok) throw new Error('tts');
  const b = await r.blob();
  ttsCache.set(key, b);
  if (ttsCache.size > 60) ttsCache.delete(ttsCache.keys().next().value);  // keep it bounded
  return b;
}

// ─── PAIN SCALE ──────────────────────────────────────────
(function buildPain() {
  const colors = ['#22C55E','#4ADE80','#86EFAC','#FDE047','#FBBF24','#FB923C','#F97316','#EF4444','#DC2626','#991B1B'];
  const scale = document.getElementById('pain-scale');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('button');
    b.className = 'pain-num';
    b.textContent = i;
    b.style.background = colors[i-1];
    b.style.color = i <= 4 ? '#000' : '#fff';
    b.onclick = () => {
      const msgs = {
        en: `My pain level is ${i} out of 10`,
        ta: `என் வலி அளவு 10-ல் ${i}`
      };
      tap(msgs.en, msgs.ta);
    };
    scale.appendChild(b);
  }
})();

// ─── LANGUAGE ────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-ta').classList.toggle('active', l==='ta');
}

// ─── TABS ────────────────────────────────────────────────
function setTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  ['needs','medical','emotion','family','custom'].forEach(t => {
    document.getElementById('grid-'+t).classList.toggle('hidden', t !== name);
  });
  if (name === 'custom') openCustom();
}

// ─── SPEAK ───────────────────────────────────────────────
function tap(en, ta) {
  buzz();
  lastEn = en; lastTa = ta;
  const txt = lang === 'ta' ? ta : en;
  const code = lang === 'ta' ? 'ta-IN' : 'en-IN';

  const el = document.getElementById('last-text');
  el.textContent = txt;
  el.className = 'last-text';
  showActions();

  tts(txt, code);
}

function speakAgain() { if (lastEn) tap(lastEn, lastTa); }

// Show the Again + Share buttons on the persistent last-message bar.
function showActions() {
  const a = document.getElementById('again-btn'); a.style.display = 'block';
  document.getElementById('share-btn').style.display = 'block';
}
// Share the last spoken message as a voice note — works from any mode.
function shareLast() {
  if (!lastEn) return;
  const txt = lang === 'ta' ? lastTa : lastEn;
  sendVoiceNote(txt, lang === 'ta' ? 'ta-IN' : 'en-IN', document.getElementById('share-btn'));
}
// Small confirming buzz on phones so he knows a tap registered.
function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }

// Speak in Appa's cloned voice when possible, else fall back to the browser voice.
//   1. pre-rendered button phrase  -> play the cached file (works offline once cached)
//   2. online                      -> synthesise live via /api/tts
//   3. otherwise                   -> browser speechSynthesis (generic voice)
function tts(text, langCode) {
  const lang2 = (langCode || 'en-IN').slice(0, 2);
  window.speechSynthesis.cancel();
  try { cloneAudio.pause(); cloneAudio.currentTime = 0; } catch (e) {}

  const file = voiceMap[lang2 + SEP + text];
  if (file) {
    cloneAudio.src = '/voice/' + file;
    cloneAudio.play().catch(() => browserTTS(text, langCode));
    return;
  }

  if (navigator.onLine) {
    ttsBlob(text, lang2)
      .then(b => { cloneAudio.src = URL.createObjectURL(b); return cloneAudio.play(); })
      .catch(() => browserTTS(text, langCode));
    return;
  }

  browserTTS(text, langCode);
}

function browserTTS(text, langCode) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode || 'en-IN';
  u.rate = 0.88; u.volume = 1; u.pitch = 0.9;
  const voices = window.speechSynthesis.getVoices();
  // use manually selected voice first
  if (selectedVoice) {
    const v = voices.find(x => x.name === selectedVoice);
    if (v) { u.voice = v; window.speechSynthesis.speak(u); return; }
  }
  // auto-pick male
  const prefix = langCode ? langCode.slice(0,2) : 'en';
  const maleKw = ['male','man','daniel','david','rishi','mohan','kumar','raj','aaron','guy','fred','alex','bruce','lee'];
  const langVoices = voices.filter(x => x.lang.startsWith(prefix));
  const maleVoice = langVoices.find(v => maleKw.some(k => v.name.toLowerCase().includes(k)));
  u.voice = maleVoice || langVoices[0] || voices.find(x => x.lang.startsWith('en')) || null;
  window.speechSynthesis.speak(u);
}

// ─── SEND AS A WHATSAPP VOICE NOTE ───────────────────────
// Turn text into Appa's cloned-voice mp3, then hand it to the phone's share
// sheet — from there he picks whichever WhatsApp chat(s)/group(s) to send to.
//   pre-rendered phrase -> the cached /voice file; anything else -> /api/tts.
async function synthToBlob(text, langCode) {
  const lang2 = (langCode || 'en-IN').slice(0, 2);
  const file = voiceMap[lang2 + SEP + text];
  if (file) {
    const r = await fetch('/voice/' + file);
    if (r.ok) return await r.blob();
  }
  if (!navigator.onLine) throw new Error('offline');
  return await ttsBlob(text, lang2);
}

// Open the OS share sheet with the mp3 (WhatsApp, Messages, …). Falls back to
// a download on browsers without file sharing (most desktops).
async function shareVoiceNote(blob, text) {
  const file = new File([blob], 'appa-message.mp3', { type: 'audio/mpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Appa', text });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;  // he cancelled the share sheet
    }
  }
  // Fallback: save the file so it can be attached in WhatsApp manually.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'appa-message.mp3'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  alert('Saved the voice note. Open WhatsApp and attach “appa-message.mp3”.');
}

async function sendVoiceNote(text, langCode, btn) {
  if (!text || !text.trim()) return;
  buzz();
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Preparing…'; }
  try {
    const blob = await synthToBlob(text.trim(), langCode);
    await shareVoiceNote(blob, text.trim());
  } catch (e) {
    alert(e.message === 'offline'
      ? 'You need internet to make a voice note in Appa’s voice.'
      : 'Could not create the voice note. Please try again.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

function sendCustomWhatsApp() {
  const t = document.getElementById('custom-input').value.trim();
  if (!t) { document.getElementById('custom-input').focus(); return; }
  sendVoiceNote(t, lang === 'ta' ? 'ta-IN' : 'en-IN', document.getElementById('custom-wa'));
}

function sendCanvasWhatsApp() {
  const t = (lastOcrResult || '').trim();
  if (!t) { alert('First tap “Read My Writing”, then send on WhatsApp.'); return; }
  sendVoiceNote(t, lang === 'ta' ? 'ta-IN' : 'en-IN', document.getElementById('canvas-wa'));
}

function toggleListen() {
  listening ? stopListen() : startListen();
}

function startListen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Speech recognition needs Chrome browser.'); return; }

  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-IN';

  let finalText = '';

  recognition.onstart = () => {
    listening = true;
    document.getElementById('listen-btn').classList.add('listening');
    document.getElementById('listen-lbl').textContent = 'Stop';
    document.getElementById('listen-overlay').classList.add('active');
    document.getElementById('transcript-box').textContent = 'Listening…';
  };

  recognition.onresult = e => {
    finalText = '';
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      e.results[i].isFinal ? finalText += e.results[i][0].transcript : interim += e.results[i][0].transcript;
    }
    document.getElementById('transcript-box').textContent = finalText || interim || '…';
  };

  recognition.onend = () => {
    listening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('listen-lbl').textContent = 'Listen';
    document.getElementById('listen-overlay').classList.remove('active');
    if (finalText.trim()) showSuggestions(finalText.trim());
  };

  recognition.onerror = () => {
    listening = false;
    document.getElementById('listen-btn').classList.remove('listening');
    document.getElementById('listen-lbl').textContent = 'Listen';
    document.getElementById('listen-overlay').classList.remove('active');
  };

  recognition.start();
}

function stopListen() {
  if (recognition) recognition.stop();
}

};

function matchSuggestions(heard) {
  const h = heard.toLowerCase();
  if (/hello|hi|good (morning|evening|afternoon)|how are you/i.test(h)) return RESPONSES.greet;
  if (/feel|feeling|how.*you|doing|okay|alright/i.test(h)) return RESPONSES.howfeel;
  if (/pain|hurt|ache|sore|discomfort/i.test(h)) return RESPONSES.pain;
  if (/eat|food|hungry|meal|drink|water/i.test(h)) return RESPONSES.eat;
  if (/sleep|tired|rest|exhausted/i.test(h)) return RESPONSES.sleep;
  if (/love|family|home|wife|son|daughter|miss|hari/i.test(h)) return RESPONSES.family;
  if (/doctor|nurse|hospital|surgery|operation|medicine|treatment/i.test(h)) return RESPONSES.doctor;
  if (/better|progress|recover|walk|improve|strong/i.test(h)) return RESPONSES.progress;
  if (/^(yes|yeah|okay|sure|right)/i.test(h)) return RESPONSES.yes;
  if (/^(no|not|nope|don't)/i.test(h)) return RESPONSES.no;
  return RESPONSES.default;
}

async function showSuggestions(heard) {
  document.getElementById('sugg-heard').textContent = '💬 "' + heard + '"';
  document.getElementById('sugg-panel').classList.add('active');

  // Always use local suggestions — works 100% offline
  const suggestions = matchSuggestions(heard);
  renderSuggestions(suggestions);

  // If online, try to enhance with Claude in background
  if (navigator.onLine) {
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:600,
          system:`You help a 69-year-old Indian man named Mr. Narayanan respond to people. He cannot speak due to a tracheostomy after a spinal injury. He is mentally sharp. IMPORTANT SAFETY RULE: he is currently nil by mouth — he CANNOT eat or drink anything (swallowing/aspiration risk). NEVER suggest eating, drinking, food, or water. If food or drink comes up, suggest he politely decline (e.g. "I am not able to eat right now"). Return ONLY a JSON array of 4 short responses, each with "en" and "ta" (Tamil) fields. No markdown. Max 10 words per response.`,
          messages:[{role:'user',content:`Someone said: "${heard}"\nReturn JSON array only.`}]
        })
      });
      const data = await res.json();
      const raw = data.content?.[0]?.text || '';
      const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
      if (Array.isArray(parsed) && parsed.length) renderSuggestions(parsed);
    } catch(e) { /* keep local suggestions */ }
  }
}

// ─── CANVAS / WRITE ──────────────────────────────────────
let drawing = false;
let brushSize = 3;
let writings = [];
let lastOcrResult = null;   // cached result
let canvasDirty = false;    // true when canvas changed since last OCR

const canvasEl = document.getElementById('write-canvas');
const ctx = canvasEl.getContext('2d');

function initCanvas() {
  // Size the drawing buffer to the canvas's actual rendered box so it
  // matches the (possibly centered/narrower) panel on desktop and lines
  // up with the touch coordinates from getBoundingClientRect().
  const rect = canvasEl.getBoundingClientRect();
  canvasEl.width  = Math.round(rect.width)  || window.innerWidth;
  canvasEl.height = Math.round(rect.height) || Math.max(window.innerHeight - 220, 250);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

function getPos(e) {
  const r = canvasEl.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

canvasEl.addEventListener('mousedown',  e => { drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
canvasEl.addEventListener('mousemove',  e => { if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); canvasDirty=true; });
canvasEl.addEventListener('mouseup',    () => drawing=false);
canvasEl.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }, {passive:false});
canvasEl.addEventListener('touchmove',  e => { e.preventDefault(); if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); canvasDirty=true; }, {passive:false});
canvasEl.addEventListener('touchend',   () => drawing=false);

function setBrush(size, el) {
  brushSize = size;
  ctx.lineWidth = size;
  document.querySelectorAll('.size-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

function clearCanvas() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasEl.width, canvasEl.height);
  lastOcrResult = null;
  canvasDirty = false;
  const btn = document.getElementById('ai-read-btn');
  if (btn) btn.textContent = navigator.onLine ? '👁 Read My Writing' : '👁 Read My Writing (no wifi)';
}

function saveWriting() {
  const dataUrl = canvasEl.toDataURL('image/png');
  // Check if canvas has any marks (not just white)
  const img = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
  const hasMarks = Array.from(img.data).some((v, i) => i%4 !== 3 && v < 240);
  if (!hasMarks) return;

  const now = new Date();
  const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  writings.unshift({ dataUrl, time: timeStr });
  // Keep last 5
  if (writings.length > 5) writings.pop();
  try { localStorage.setItem('appa_writings', JSON.stringify(writings.map(w => ({...w, dataUrl: w.dataUrl.slice(0,200)+'...'}))));} catch(e){}
  renderWritingsLog();
  clearCanvas();
}

function renderWritingsLog() {
  const log = document.getElementById('writings-log');
  log.innerHTML = '';
  if (writings.length === 0) return;
  writings.forEach((w, i) => {
    const entry = document.createElement('div');
    entry.className = 'writing-entry';
    const img = document.createElement('img');
    img.className = 'writing-thumb';
    img.src = w.dataUrl;
    const time = document.createElement('span');
    time.className = 'writing-time';
    time.textContent = `Written at ${w.time}`;
    const del = document.createElement('button');
    del.className = 'writing-del';
    del.textContent = '✕';
    del.onclick = () => { writings.splice(i,1); renderWritingsLog(); };
    const show = document.createElement('button');
    show.className = 'canvas-btn speak';
    show.style.cssText = 'flex:0;min-width:auto;padding:6px 10px;font-size:0.7rem;';
    show.textContent = '🔍 View';
    show.onclick = () => loadWriting(w.dataUrl);
    entry.appendChild(img); entry.appendChild(time);
    entry.appendChild(show); entry.appendChild(del);
    log.appendChild(entry);
  });
  // Reinit canvas height after log changes
  setTimeout(initCanvas, 50);
}

function loadWriting(dataUrl) {
  const image = new Image();
  image.onload = () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvasEl.width,canvasEl.height);
    ctx.drawImage(image, 0, 0);
  };
  image.src = dataUrl;
}

function speakCanvasDirect() {
  // Just announce and show the canvas — nurse/family looks at screen
  const el = document.getElementById('last-text');
  el.textContent = 'I have written something — please look at my screen';
  showActions();
  lastEn = 'I have written something. Please look at my screen.';
  lastTa = 'நான் ஏதோ எழுதியிருக்கிறேன். என் திரையை பாருங்கள்.';
  tts(lang === 'ta' ? lastTa : lastEn, lang === 'ta' ? 'ta-IN' : 'en-IN');
}

async function speakCanvas() {
  // Check canvas has marks
  const imgData = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
  const hasMarks = Array.from(imgData.data).some((v, i) => i%4 !== 3 && v < 240);
  if (!hasMarks) { tts('Please write something first', 'en-IN'); return; }

  // Use cached result if canvas hasn't changed
  if (lastOcrResult && !canvasDirty) {
    const el = document.getElementById('last-text');
    el.textContent = `"${lastOcrResult}"`;
    showActions();
    lastEn = lastOcrResult; lastTa = lastOcrResult;
    tts(lastOcrResult, lang === 'ta' ? 'ta-IN' : 'en-IN');
    return;
  }

  // If offline, skip OCR entirely
  if (!navigator.onLine) {
    const el = document.getElementById('last-text');
    el.textContent = 'I have written something — please look at the screen';
    showActions();
    tts('I have written something. Please look at the screen.', 'en-IN');
    return;
  }

  // Update button to show loading
  const btn = document.getElementById('ai-read-btn');
  const orig = btn.textContent;
  btn.textContent = '⏳ Reading…';
  btn.disabled = true;

  // Show status in last-text bar
  const el = document.getElementById('last-text');
  el.textContent = 'Reading your writing…';

  try {
    const dataUrl = canvasEl.toDataURL('image/png');
    const base64  = dataUrl.split(',')[1];

    const resp = await fetch('/api/ocr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64 })
    });

    const data = await resp.json();
    const text = data?.text?.trim() || 'UNCLEAR';

    if (text && text !== 'UNCLEAR') {
      el.textContent = `"${text}"`;
      showActions();
      lastEn = text; lastTa = text;
      lastOcrResult = text;
      canvasDirty = false;
      const btn2 = document.getElementById('ai-read-btn');
      if (btn2) btn2.textContent = '👁 Read Again';
      tts(text, lang === 'ta' ? 'ta-IN' : 'en-IN');
    } else {
      el.textContent = 'Could not read clearly — please try again';
      tts('I could not read the writing clearly. Please look at the screen.', 'en-IN');
    }
  } catch(e) {
    el.textContent = 'Could not connect — please look at the screen';
    tts('I have written something. Please look at the screen.', 'en-IN');
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

let selectedVoice = null;

function populateVoices() {
  const voices = window.speechSynthesis.getVoices();
  const sel = document.getElementById('voice-select');
  sel.innerHTML = '';
  // sort: male-sounding names first
  const maleKw = ['male','man','daniel','david','rishi','mohan','kumar','raj','aaron','guy','fred','alex','bruce','lee','oliver','thomas','mark'];
  const sorted = [...voices].sort((a,b) => {
    const am = maleKw.some(k => a.name.toLowerCase().includes(k)) ? 0 : 1;
    const bm = maleKw.some(k => b.name.toLowerCase().includes(k)) ? 0 : 1;
    return am - bm;
  });
  sorted.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    const isMale = maleKw.some(k => v.name.toLowerCase().includes(k));
    o.textContent = (isMale ? '♂ ' : '♀ ') + v.name + ' (' + v.lang + ')';
    o.dataset.name = v.name;
    sel.appendChild(o);
  });
  // auto-select first male-looking voice
  const firstMale = sorted.findIndex(v => maleKw.some(k => v.name.toLowerCase().includes(k)));
  if (firstMale >= 0) sel.selectedIndex = firstMale;
}

function openVoicePicker() {
  populateVoices();
  document.getElementById('voice-picker').style.display = 'flex';
}
function closeVoicePicker() {
  document.getElementById('voice-picker').style.display = 'none';
}
function testVoice() {
  const sel = document.getElementById('voice-select');
  const name = sel.options[sel.selectedIndex]?.dataset?.name;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x => x.name === name);
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('Hello, I am speaking with this voice. Testing one two three.');
  u.voice = v || null;
  u.rate = 0.88; u.pitch = 0.9; u.volume = 1;
  window.speechSynthesis.speak(u);
}
function saveVoice() {
  const sel = document.getElementById('voice-select');
  const name = sel.options[sel.selectedIndex]?.dataset?.name;
  selectedVoice = name;
  localStorage.setItem('ttt-voice', name);
  closeVoicePicker();
  // confirm
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x => x.name === name);
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('Voice set. Ready to speak.');
  u.voice = v || null; u.rate = 0.88; u.pitch = 0.9;
  window.speechSynthesis.speak(u);
}

window.speechSynthesis.onvoiceschanged = () => {
  window.speechSynthesis.getVoices();
  // restore saved voice
  const saved = localStorage.getItem('ttt-voice');
  if (saved) selectedVoice = saved;
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSugg(); closeCustom(); stopListen(); closeVoicePicker(); closeCanvas(); }
});

// ─── OFFLINE SUPPORT ─────────────────────────────────────
// Pre-caches the app + all of Appa's voice clips so buttons work with no wifi.
// Note: service workers only run over HTTPS (or localhost) — so this activates
// on the deployed URL / home-screen app, not over a plain http LAN address.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
